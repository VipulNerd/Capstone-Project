name: Deploy to Azure VM

# On push to main: run the tests, then deploy the commit to the VM over SSH (deploy/vm/deploy.sh).
# Needs no Azure permissions or service principal: only an SSH deploy key for the VM.
#
# One-time setup (see deploy/vm/README.md):
#   Repository VARIABLES:  VM_HOST  (e.g. mom-xxxx.southindia.cloudapp.azure.com)   VM_USER (azureuser)
#   Repository SECRETS:    VM_SSH_KEY        private key of the deploy key pair
#                          VM_KNOWN_HOSTS    output of: ssh-keyscan -t ed25519 <VM_HOST>
#   Until VM_HOST is set, the deploy job is skipped (not failed).

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/vm/**', '.github/workflows/deploy-vm.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false   # never cancel a deployment half-way

jobs:
  test:
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and pinned host key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        run: bash deploy/vm/deploy.sh "${{ vars.VM_USER || 'azureuser' }}@${{ vars.VM_HOST }}"
