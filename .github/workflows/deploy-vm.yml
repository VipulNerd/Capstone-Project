name: Deploy to Azure VM

# On push to main: run the tests, then deploy the commit to the VM over SSH (deploy/vm/deploy.sh).
# Needs no Azure permissions or service principal: only an SSH deploy key for the VM.
#
# One-time setup (see deploy/vm/README.md):
#   Repository VARIABLES:  VM_HOST  (e.g. mom-xxxx.southindia.cloudapp.azure.com)   VM_USER (azureuser)
#   Repository SECRETS:    VM_SSH_KEY        private key of the deploy key pair
#                          VM_KNOWN_HOSTS    optional; defaults to deploy/vm/known_hosts (the VM's public host key)
#   Until VM_HOST is set, the deploy job is skipped (not failed).

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/vm/**', '.github/workflows/deploy-vm.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false   # never cancel a deployment half-way

jobs:
  test:
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: vars.VM_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and pinned host key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          # Public fingerprint of the deploy key the VM accepts (from: ssh-keygen -lf ~/.ssh/mom_vm_ci.pub).
          EXPECTED_KEY_FP: ${{ vars.VM_SSH_KEY_FP || 'SHA256:MrVxkngFbbb5fSztSaKBTVIRfZ7HZQXMtYFrCTdUtFg' }}
        run: |
          install -m 700 -d ~/.ssh
          # Clean up common paste mistakes: Windows line breaks, PowerShell ">>" prompts, stray spaces.
          clean() { printf '%s\n' "$1" | tr -d '\r' | sed -e 's/^>> *//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' || true; }
          # Rebuild the private key from its base64 body, so lost or extra line breaks don't matter.
          raw="$(printf '%s' "$VM_SSH_KEY" | tr -d '\r')"
          body="$(printf '%s' "$raw" | sed -e 's/-----[A-Z ]*-----//g' -e 's/>>//g' | tr -d ' \t\n')"
          has_header=no; case "$raw" in *"BEGIN OPENSSH PRIVATE KEY"*) has_header=yes;; esac
          echo "::notice::VM_SSH_KEY received: ${#raw} characters, $(printf '%s\n' "$raw" | grep -c .) non-empty lines, BEGIN line: $has_header, key body: ${#body} characters (expected for the current deploy key: about 418 / 7 / yes / 344; 0 characters means the secret is empty or not visible to this job)"
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$VM_KNOWN_HOSTS" ]; then clean "$VM_KNOWN_HOSTS" | grep -v '^#' > ~/.ssh/known_hosts
          else cp deploy/vm/known_hosts ~/.ssh/known_hosts; fi

          # Diagnostics (fingerprints are public; the key itself is never printed).
          echo "VM_SSH_KEY: $(wc -l < ~/.ssh/id_ed25519) lines, first: $(head -c 36 ~/.ssh/id_ed25519)"
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub; then
            echo "::error::VM_SSH_KEY is not a valid private key. Paste the whole file ~/.ssh/mom_vm_ci, BEGIN to END lines included."
            exit 1
          fi
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"
          if [ -n "$EXPECTED_KEY_FP" ] && ! ssh-keygen -lf ~/.ssh/id_ed25519.pub | grep -qF "$EXPECTED_KEY_FP"; then
            echo "::error::VM_SSH_KEY is a different key than the one the VM accepts ($EXPECTED_KEY_FP). Paste ~/.ssh/mom_vm_ci again."
            exit 1
          fi
          if ! ssh-keygen -F "${{ vars.VM_HOST }}" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::known_hosts has no entry for '${{ vars.VM_HOST }}'. Check the VM_HOST variable (host name only, no https://)."
            exit 1
          fi
          echo "Host key entry found for ${{ vars.VM_HOST }}"
      - name: Deploy
        run: bash deploy/vm/deploy.sh "${{ vars.VM_USER || 'azureuser' }}@${{ vars.VM_HOST }}"
