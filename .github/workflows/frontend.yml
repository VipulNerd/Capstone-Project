name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # /api is proxied to the backend by nginx (Docker / Azure Container Apps).
      - run: npm run build
      # Deployment to Azure Container Apps: infra/deploy.ps1 (see docs/DEPLOYMENT.md).
