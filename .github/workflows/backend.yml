name: Backend CI

on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # In-memory SQLite, fake AI client, fake mailer: no secrets needed.
      - run: python -m pytest -q

  test-postgres:
    name: Tests + migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mom
          POSTGRES_PASSWORD: mom
          POSTGRES_DB: mom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mom -d mom_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mom:mom@localhost:5432/mom_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Same tests against real Postgres (same engine as Azure Database for PostgreSQL).
      - run: python -m pytest -q
      # The migrations must apply, match the models, and roll back cleanly.
      - name: Migrations up / check / down / up
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://mom:mom@localhost:5432/mom_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://mom:mom@localhost:5432/mom_test")
          with e.begin() as c:  # the test run left tables behind; start from an empty schema
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
