name: Deploy to Azure

# Backend -> Azure Container Apps (image built in Azure Container Registry)
# Frontend -> Azure Static Web Apps
# Auth: OpenID Connect (federated credential), so no Azure password or key is stored in GitHub.
#
# One-time setup (see docs/DEPLOYMENT.md, "CI/CD"):
#   Repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   from the deploy identity
#     AZURE_RESOURCE_GROUP   ACR_NAME   BACKEND_APP   BACKEND_URL   STATIC_WEB_APP
#   Until AZURE_CLIENT_ID is set, the deploy jobs are skipped (not failed).
#   App secrets (DB password, OpenAI key, SMTP) live in the Container App, never in GitHub.

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deployment half-way

jobs:
  backend:
    name: Backend -> Container Apps
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build -r "${{ vars.ACR_NAME }}" -t "mom-backend:${GITHUB_SHA::12}" backend -o none

      - name: Roll out new revision
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.BACKEND_APP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/mom-backend:${GITHUB_SHA::12}" -o none

      - name: Health check
        # Scale-to-zero: the first request starts a replica, which runs migrations first.
        run: |
          for i in $(seq 1 36); do
            body=$(curl -s --max-time 20 "${{ vars.BACKEND_URL }}/health" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q '"database":true' && exit 0
            sleep 5
          done
          echo "::error::Backend did not become healthy. Check: az containerapp logs show -n ${{ vars.BACKEND_APP }} -g ${{ vars.AZURE_RESOURCE_GROUP }}"
          exit 1

  frontend:
    name: Frontend -> Static Web Apps
    if: vars.AZURE_CLIENT_ID != ''
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_URL }}   # baked into the bundle; a URL, not a secret
        run: |
          npm ci
          npm run lint
          npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ vars.STATIC_WEB_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          host=$(az staticwebapp show -n "${{ vars.STATIC_WEB_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query defaultHostname -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist   # already built above
          skip_app_build: true
          skip_api_build: true

      - name: Site is reachable
        run: |
          curl -sf --max-time 30 -o /dev/null "${{ steps.swa.outputs.url }}/login"
          echo "Deployed: ${{ steps.swa.outputs.url }}"
