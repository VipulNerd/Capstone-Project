# Rendered by the nginx image's envsubst step (only defined env vars, e.g. ${BACKEND_URL}, are replaced).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the FastAPI container: /api/meetings -> ${BACKEND_URL}/meetings
  location /api/ {
    # The container's own DNS server (Docker's 127.0.0.11, or Azure Container Apps' resolver),
    # filled in by the nginx image from /etc/resolv.conf. Resolving at request time lets nginx
    # start before the backend.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $backend ${BACKEND_URL};
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    # Send the backend's own host name: Azure Container Apps routes internal traffic by Host.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 30m;  # backend accepts uploads up to 25 MB
  }

  # Long-term caching for hashed build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback so deep links like /meetings/3/review work on refresh
  location / {
    try_files $uri $uri/ /index.html;
  }
}
