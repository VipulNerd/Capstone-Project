services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mom
      POSTGRES_PASSWORD: mom
      POSTGRES_DB: mom_db
    ports:
      - "5433:5432"   # 5433 on the host so it doesn't clash with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mom -d mom_db"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://mom:mom@db:5432/mom_db
      AUDIO_DIR: /data/audio
      EMAIL_OUTBOX_DIR: /data/outbox
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000   # nginx forwards /api/* here
    ports:
      - "8080:80"   # open http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
  appdata:
